name: auth
domain: auth
version: 3.0.1
publisher: stuff8
status: unverified
license: mit
summary: "Authentication: login, register, JWT, single active session, email verification, signup events"

targets:
  - linux/amd64

artifacts: {}

contract:
  version: 2
  api: "auth REST API"
  env:
    fields:
      JWT_SECRET:
        required: true
        type: secret
        managed: shared-jwt
        description: "HS512 signing key shared by every estate service that validates tokens"
      MONGODB_URI:
        required: true
        type: uri
        managed: mongo-db
        description: "MongoDB connection string for the estate's managed database"
      SERVER_PORT:
        required: true
        type: int
        managed: port
        description: "Port the auth API listens on"
      JWT_EXPIRATION:
        type: int
        default: "2592000000"
        min: 60000
        group: jwt
        description: "JWT lifetime in milliseconds (30 days by default)"
      API_BASE_URL:
        type: url
        group: server
        description: "Public base URL clients use to reach this API; empty falls back to http://localhost:<port>/api"
      CORS_ALLOWED_ORIGINS:
        type: csv-url
        managed: cors-origins
        description: "Origins allowed to call this API; the first entry doubles as the app origin"
      RATE_LIMIT_GENERAL_BURST:
        type: int
        default: "120"
        min: 1
        group: rate-limit
        description: "Token-bucket burst for general routes"
      RATE_LIMIT_GENERAL_REPLENISH_SECS:
        type: int
        default: "1"
        min: 1
        group: rate-limit
        description: "Seconds per token refill for general routes"
      RATE_LIMIT_AUTH_BURST:
        type: int
        default: "5"
        min: 1
        group: rate-limit
        description: "Token-bucket burst for login/register/change-password"
      RATE_LIMIT_AUTH_REPLENISH_SECS:
        type: int
        default: "10"
        min: 1
        group: rate-limit
        description: "Seconds per token refill for credential routes"
      EMAIL_VERIFICATION_REQUIRED:
        type: bool
        default: "false"
        group: email
        description: "Require users to verify their email before public interactions; requires BREVO_API_KEY"
      EMAIL_VERIFICATION_TTL_HOURS:
        type: int
        default: "24"
        min: 1
        max: 8760
        group: email
        description: "Hours a verification link stays valid"
      EMAIL_VERIFICATION_PUBLIC_URL:
        type: url
        group: email
        description: "Public origin for verification links; empty uses the first CORS origin"
      BREVO_API_KEY:
        type: secret
        group: email
        description: "Brevo transactional API key used to send verification mail"
      MAIL_FROM_EMAIL:
        type: email
        group: email
        description: "Sender address for transactional mail"
      MAIL_FROM_NAME:
        type: string
        default: "Auth"
        group: email
        description: "Sender display name for transactional mail"
      ECO_AUTH_DEFAULT_ROLE:
        type: string
        managed: identity-roles
        description: "Role assigned to new accounts (from the estate identity model)"
      ECO_AUTH_ROLES:
        type: csv
        managed: identity-roles
        description: "Roles accepted at registration (from the estate identity model)"
      SIGNUP_EVENT_URL:
        type: url
        managed: signup-event
        description: "Ingest endpoint for the user.signed_up event (fire-and-forget)"
      SIGNUP_EVENT_TOKEN:
        type: secret
        description: "Bearer token for the signup event sink"
      SESSION_REQUIRED:
        type: bool
        default: "true"
        group: session
        description: "Single-session enforcement: reject bearer tokens without an active session (re-login required after upgrade). Set false for a graceful legacy-token window."
    # Derived v1 views of `fields` above — kept for consumers that predate the
    # contract v2 schema (eco < 0.4.2). `fields` is authoritative; keep in sync.
    required:
      - JWT_SECRET
      - MONGODB_URI
      - SERVER_PORT
    optional:
      - JWT_EXPIRATION
      - API_BASE_URL
      - CORS_ALLOWED_ORIGINS
      - RATE_LIMIT_GENERAL_BURST
      - RATE_LIMIT_GENERAL_REPLENISH_SECS
      - RATE_LIMIT_AUTH_BURST
      - RATE_LIMIT_AUTH_REPLENISH_SECS
      - EMAIL_VERIFICATION_REQUIRED
      - EMAIL_VERIFICATION_TTL_HOURS
      - EMAIL_VERIFICATION_PUBLIC_URL
      - ECO_AUTH_DEFAULT_ROLE
      - ECO_AUTH_ROLES
      - BREVO_API_KEY
      - MAIL_FROM_EMAIL
      - MAIL_FROM_NAME
      - SIGNUP_EVENT_URL
      - SIGNUP_EVENT_TOKEN
      - SESSION_REQUIRED
    defaults:
      JWT_EXPIRATION: "2592000000"
      RATE_LIMIT_GENERAL_BURST: "120"
      RATE_LIMIT_GENERAL_REPLENISH_SECS: "1"
      RATE_LIMIT_AUTH_BURST: "5"
      RATE_LIMIT_AUTH_REPLENISH_SECS: "10"
      EMAIL_VERIFICATION_REQUIRED: "false"
      EMAIL_VERIFICATION_TTL_HOURS: "24"
      MAIL_FROM_NAME: "Auth"
      SESSION_REQUIRED: "true"
  db: mongodb@7
  network:
    inbound: [http]
    outbound: [http, https]
  resources:
    memory: "64m"
    disk: "128m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
