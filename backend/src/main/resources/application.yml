spring:
  application:
    name: rwid-community-api
  
  config:
    import: optional:file:.env[.properties]
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/rwid_community}
      auto-index-creation: false
  
  jpa:
    show-sql: false
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  ssl:
    enabled: false

app:
  api-base-url: ${API_BASE_URL:http://localhost:8080/api}

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    path: ${STORAGE_LOCAL_PATH:./storage}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}

midtrans:
  server-key: ${MIDTRANS_SERVER_KEY:}
  client-key: ${MIDTRANS_CLIENT_KEY:}
  is-production: ${MIDTRANS_IS_PRODUCTION:false}

logging:
  level:
    root: INFO
    com.rwid: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
