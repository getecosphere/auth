[package]
name = "rwid-auth-service"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "2.8"
futures-util = "0.3"
bson = { version = "2.9", features = ["chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tower_governor = "0.4.2"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
governor = "0.6"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "multipart", "query"] }
